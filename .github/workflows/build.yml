name: Gerar APK RS-918BR PRO Automatico

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Criar toda a estrutura do projeto e codigos automaticamente
        run: |
          mkdir -p app/src/main/java/com/roadstar/autostart

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "RS918BR-AutoStart"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.1.4' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.roadstar.autostart'
              compileSdk 33

              defaultConfig {
                  applicationId "com.roadstar.autostart"
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />

              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />

              <uses-permission android:name="android.permission.WRITE_SECURE_SETTINGS"
                  tools:ignore="ProtectedPermissions" />
              <uses-permission android:name="android.permission.WRITE_SETTINGS"
                  tools:ignore="ProtectedPermissions" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_menu_mylocation"
                  android:label="RS-918BR AutoStart"
                  android:theme="@android:style/Theme.NoDisplay">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".BootReceiver"
                      android:enabled="true"
                      android:exported="true">
                      <intent-filter android:priority="999">
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                          <action android:name="com.htc.intent.action.QUICKBOOT_POWERON" />
                          <action android:name="android.intent.action.LOCKED_BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                          <action android:name="android.net.conn.CONNECTIVITY_CHANGE" />
                          <action android:name="android.net.wifi.STATE_CHANGE" />
                      </intent-filter>
                  </receiver>

                  <service
                      android:name=".WakeService"
                      android:enabled="true"
                      android:exported="false" />

              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/roadstar/autostart/SystemController.java
          package com.roadstar.autostart;

          import android.bluetooth.BluetoothAdapter;
          import android.content.Context;
          import android.net.wifi.WifiManager;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.widget.Toast;

          public class SystemController {

              public static void ativarTudo(final Context context) {
                  try {
                      WifiManager wifiManager = (WifiManager) context.getApplicationContext().getSystemService(Context.WIFI_SERVICE);
                      if (wifiManager != null && !wifiManager.isWifiEnabled()) {
                          wifiManager.setWifiEnabled(true);
                      }
                  } catch (Throwable ignored) {}

                  try {
                      BluetoothAdapter bluetoothAdapter = BluetoothAdapter.getDefaultAdapter();
                      if (bluetoothAdapter != null && !bluetoothAdapter.isEnabled()) {
                          bluetoothAdapter.enable();
                      }
                  } catch (Throwable ignored) {}

                  try {
                      Settings.Secure.putInt(
                          context.getContentResolver(),
                          Settings.Secure.LOCATION_MODE,
                          Settings.Secure.LOCATION_MODE_HIGH_ACCURACY
                      );
                  } catch (Throwable ignored) {}

                  sincronizarHora(context);

                  new Handler(Looper.getMainLooper()).postDelayed(new Runnable() {
                      @Override
                      public void run() {
                          sincronizarHora(context);
                      }
                  }, 8000);

                  try {
                      Toast.makeText(context, "RS-918BR: Wi-Fi, BT, GPS e Hora ativados!", Toast.LENGTH_LONG).show();
                  } catch (Throwable ignored) {}
              }

              public static void sincronizarHora(Context context) {
                  try {
                      Settings.Global.putInt(context.getContentResolver(), Settings.Global.AUTO_TIME, 0);
                      Settings.Global.putInt(context.getContentResolver(), Settings.Global.AUTO_TIME, 1);
                      Settings.Global.putInt(context.getContentResolver(), Settings.Global.AUTO_TIME_ZONE, 1);
                  } catch (Throwable ignored) {}
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/roadstar/autostart/BootReceiver.java
          package com.roadstar.autostart;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;

          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  if (context == null) return;
                  SystemController.ativarTudo(context);

                  try {
                      Intent serviceIntent = new Intent(context, WakeService.class);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          context.startForegroundService(serviceIntent);
                      } else {
                          context.startService(serviceIntent);
                      }
                  } catch (Throwable ignored) {}
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/roadstar/autostart/WakeService.java
          package com.roadstar.autostart;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.os.Build;
          import android.os.IBinder;

          public class WakeService extends Service {
              private BroadcastReceiver screenWakeReceiver;

              @Override
              public void onCreate() {
                  super.onCreate();
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          String channelId = "rs918_autostart_channel";
                          NotificationChannel channel = new NotificationChannel(
                                  channelId, "AutoStart RS-918BR", NotificationManager.IMPORTANCE_LOW);
                          NotificationManager manager = getSystemService(NotificationManager.class);
                          if (manager != null) manager.createNotificationChannel(channel);

                          Notification notification = new Notification.Builder(this, channelId)
                                  .setContentTitle("RS-918BR AutoStart Ativo")
                                  .setContentText("Monitorando ignicao para ativar Wi-Fi, BT, GPS e Hora")
                                  .setSmallIcon(android.R.drawable.ic_menu_mylocation)
                                  .build();
                          startForeground(1, notification);
                      }
                  } catch (Throwable ignored) {}

                  screenWakeReceiver = new BroadcastReceiver() {
                      @Override
                      public void onReceive(Context context, Intent intent) {
                          SystemController.ativarTudo(context);
                      }
                  };

                  IntentFilter filter = new IntentFilter();
                  filter.addAction(Intent.ACTION_SCREEN_ON);
                  filter.addAction(Intent.ACTION_USER_PRESENT);
                  filter.addAction("android.net.wifi.STATE_CHANGE");
                  filter.addAction("android.net.conn.CONNECTIVITY_CHANGE");
                  registerReceiver(screenWakeReceiver, filter);
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  SystemController.ativarTudo(this);
                  return START_STICKY;
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  if (screenWakeReceiver != null) {
                      try {
                          unregisterReceiver(screenWakeReceiver);
                      } catch (Throwable ignored) {}
                  }
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/roadstar/autostart/MainActivity.java
          package com.roadstar.autostart;

          import android.app.Activity;
          import android.content.Intent;
          import android.os.Build;
          import android.os.Bundle;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  SystemController.ativarTudo(this);

                  try {
                      Intent serviceIntent = new Intent(this, WakeService.class);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(serviceIntent);
                      } else {
                          startService(serviceIntent);
                      }
                  } catch (Throwable ignored) {}

                  finish();
              }
          }
          EOF

      - name: 2. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Instalar Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: 4. Compilar e Assinar o APK
        run: gradle assembleDebug --no-daemon

      - name: 5. Disponibilizar APK Pronto para Download
        uses: actions/upload-artifact@v4
        with:
          name: RS918BR-AutoStart-APK-Pronto
          path: app/build/outputs/apk/debug/app-debug.apk
